name: 🗄️ Backup Semanal do Banco

on:
  schedule:
    - cron: '0 3 * * 1'   # Toda segunda-feira às 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    name: Backup do Supabase
    runs-on: ubuntu-latest

    env:
      PGHOST: ${{ secrets.SUPABASE_HOST }}
      PGPORT: 6543
      PGUSER: postgres.jduicftyfhfydjwxhdwk
      PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      PGDATABASE: postgres

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar PostgreSQL client 17
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg lsb-release

          # Adiciona o repositório oficial do PostgreSQL (para ter a versão 17)
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null

          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

          # Confirma que a versão 17 está ativa
          echo "✅ Versão instalada:"
          pg_dump --version

      - name: Debug - verificar variáveis
        run: |
          echo "🔍 Verificando variáveis de ambiente..."
          echo "Host: $PGHOST"
          echo "Port: $PGPORT"
          echo "User: $PGUSER"
          echo "Database: $PGDATABASE"
          echo "Password length: ${#PGPASSWORD}"
          pg_dump --version

      - name: Testar conexão
        run: |
          echo "🔌 Testando conexão..."
          psql -c "SELECT version();" || {
            echo "❌ Falha na conexão"
            exit 1
          }
          echo "✅ Conexão estabelecida"

      - name: Gerar backup com pg_dump
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          FILENAME="backup_supabase_${TIMESTAMP}.dump"

          echo "📦 Gerando backup: $FILENAME"
          pg_dump \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$FILENAME" || {
            echo "❌ Falha ao gerar backup"
            exit 1
          }

          echo "🔎 Verificando integridade do backup..."
          pg_restore --list "$FILENAME" > /dev/null || {
            echo "❌ Backup corrompido"
            exit 1
          }

          echo "✅ Backup válido"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
          ls -lh "$FILENAME"

      - name: Salvar backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-supabase-${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 90
          if-no-files-found: error