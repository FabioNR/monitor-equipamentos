name: 🏥 Health Check do Sistema

on:
  schedule:
    - cron: '30 3 */6 * *'
  workflow_dispatch:

jobs:
  health-check:
    name: Registrar Health Check
    runs-on: ubuntu-latest

    env:
      PGHOST: ${{ secrets.SUPABASE_HOST }}
      PGPORT: 6543
      PGUSER: postgres.jduicftyfhfydjwxhdwk
      PGPASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      PGDATABASE: postgres

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Debug - verificar variáveis
        run: |
          echo "🔍 Verificando variáveis de ambiente..."
          echo "Host: $PGHOST"
          echo "Port: $PGPORT"
          echo "User: $PGUSER"
          echo "Database: $PGDATABASE"
          echo "Password length: ${#PGPASSWORD}"
          psql --version

      - name: Testar conexão
        run: |
          echo "🔌 Testando conexão..."
          psql -c "SELECT version();" || {
            echo "❌ Falha na conexão"
            exit 1
          }
          echo "✅ Conexão estabelecida"

      - name: Verificar tabela
        run: |
          echo "🔍 Verificando tabela health_checks..."
          psql -c "SELECT count(*) FROM public.health_checks;" || {
            echo "❌ Tabela não encontrada"
            exit 1
          }
          echo "✅ Tabela existe"

      - name: Inserir health check
        run: |
          echo "🏥 Inserindo health check..."
          psql -c "INSERT INTO public.health_checks (sistema, status, mensagem) VALUES ('monitor-equipamentos', 'operante', 'Health check automático via GitHub Actions');" || {
            echo "❌ Falha ao inserir"
            exit 1
          }
          echo "✅ Health check inserido"

      - name: Mostrar últimos registros
        run: |
          echo "📊 Últimos health checks:"
          psql -c "SELECT sistema, status, to_char(verificado_em, 'YYYY-MM-DD HH24:MI:SS') AS verificado, mensagem FROM public.health_checks ORDER BY verificado_em DESC LIMIT 5;"