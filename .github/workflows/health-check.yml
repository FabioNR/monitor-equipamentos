name: 🏥 Health Check do Sistema

on:
  schedule:
    - cron: '30 3 */6 * *'   # A cada 6 dias às 03:30 UTC
  workflow_dispatch:

jobs:
  health-check:
    name: Registrar Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl ca-certificates gnupg
          install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-17

      - name: Testar conexão
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "🔌 Testando conexão..."
          psql "$DATABASE_URL" -c "SELECT version();" || exit 1
          echo "✅ Conexão OK"

      - name: Verificar tabela
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "🔍 Verificando tabela..."
          psql "$DATABASE_URL" -c "SELECT count(*) FROM public.health_checks;" || exit 1
          echo "✅ Tabela existe"

      - name: Inserir health check
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" \
            -v sistema="monitor-equipamentos" \
            -v status="operante" \
            -v mensagem="Health check automático via GitHub Actions" \
            -c "INSERT INTO public.health_checks (sistema, status, mensagem) VALUES (:'sistema', :'status', :'mensagem');"

      - name: Mostrar últimos registros
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "📊 Últimos health checks:"
          psql "$DATABASE_URL" -c "SELECT sistema, status, to_char(verificado_em, 'YYYY-MM-DD HH24:MI:SS') AS verificado, mensagem FROM public.health_checks ORDER BY verificado_em DESC LIMIT 5;"